<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seleção - Profissional</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <button id="theme-toggle" class="theme-toggle" aria-label="Alternar Tema">
        🌙
    </button>
    <button id="history-toggle" class="theme-toggle history-btn" onclick="loadHistory()" aria-label="Histórico">
        🕒
    </button>
    <button id="admin-toggle" class="theme-toggle admin-btn" onclick="showAdminScreen()" aria-label="Gerenciar Dados">
        ⚙️
    </button>

    <div class="container">



        <div id="screen-empresa" class="screen active">
            <div class="header">
                <h2>1. SELECIONE A EMPRESA</h2>
            </div>
            <div id="list-empresas">
            </div>
        </div>

        <div id="screen-setor" class="screen">
            <div class="header">
                <button class="back-button" onclick="showScreen('screen-empresa')">← Voltar</button>
                <h2>2. SETORES | <span id="current-empresa" style="color:var(--text-color);"></span></h2>
            </div>
            <div id="list-setores">
            </div>
        </div>

        <div id="screen-funcionario" class="screen">
            <div class="header">
                <button class="back-button" onclick="showScreen('screen-setor')">← SETORES</button>
                <h2>3. FUNCIONÁRIOS | <span id="current-setor" style="color:var(--text-color);"></span></h2>
            </div>
            <p style="text-transform: uppercase; font-size: 0.9em; color: var(--subtle-text-color);">Clique para
                selecionar/desselecionar.</p>
            <div id="list-funcionarios">
            </div>

            <button id="send-button" class="send-button" disabled onclick="sendSelectedFuncionarios()">
                Enviar Selecionados (0)
            </button>

            <div id="status-message" class="status-message" aria-live="polite"></div>
        </div>

        <div id="screen-history" class="screen">
            <div class="header">
                <button class="back-button" onclick="showScreen('screen-empresa')">← INÍCIO</button>
                <h2>HISTÓRICO (HOJE)</h2>
            </div>
            <p style="font-size: 0.9em; color: var(--subtle-text-color); margin-bottom: 15px;">
                Toque em "Remover" para corrigir um envio indevido no aplicativo.
            </p>
            <div id="list-history">
                <!-- Itens do histórico -->
            </div>
        </div>

        <div id="screen-admin" class="screen">
            <div class="header">
                <button class="back-button" onclick="showScreen('screen-empresa')">← INÍCIO</button>
                <h2>GERENCIAR DADOS</h2>
            </div>

            <div class="admin-controls">
                <button class="action-btn primary" onclick="openEditModal()">+ Novo Funcionário</button>
                <button class="action-btn secondary" onclick="downloadDataJs()">⬇ Baixar data.js</button>
                <button class="action-btn danger" onclick="resetData()">⚠ Resetar</button>
            </div>

            <input type="text" id="admin-search" placeholder="Buscar funcionário..." onkeyup="filterAdminList()"
                class="search-input">

            <div id="list-admin" class="admin-list">
                <!-- Lista de funcionários para edição -->
            </div>
        </div>

        <!-- Modal de Edição -->
        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <h3>Editar Funcionário</h3>
                <input type="hidden" id="edit-index">

                <label>Nome</label>
                <input type="text" id="edit-nome" placeholder="Nome Completo">

                <label>Empresa</label>
                <input type="text" id="edit-empresa" placeholder="Ex: HUB">

                <label>Setor</label>
                <input type="text" id="edit-setor" placeholder="Ex: TI">

                <div class="modal-actions">
                    <button class="action-btn secondary" onclick="closeEditModal()">Cancelar</button>
                    <button class="action-btn primary" onclick="saveFuncionario()">Salvar</button>
                </div>
            </div>
        </div>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
